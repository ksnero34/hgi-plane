services:
  plane-redis:
    container_name: dev-plane-redis
    image: valkey/valkey:7.2.11-alpine
    #restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: dev-plane-mq
    image: rabbitmq:3.13.6-management-alpine
    #restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
         test: ["CMD", "rabbitmqctl", "status"]
         interval: 10s
         timeout: 5s
         retries: 5
    env_file:
      - .env.dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-minio:
    container_name: dev-plane-minio
    image: minio/minio
    #restart: unless-stopped
    networks:
      - dev_env
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - ./data/uploads:/export
    env_file:
      - .env.dev
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  plane-db:
    container_name: dev-plane-db
    image: hgi-postgres:16.4
    #restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env.dev
    environment:
      PGDATA: /var/lib/postgresql/data

  web:
    container_name: dev-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    image: harbor.hwgeneralins.com/plane-dev/web:1.2.1-dev
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/web:/app/apps/web
      - ./node_modules:/app/node_modules
      - ./packages:/app/packages
    env_file:
      - ./apps/web/.env.dev
    depends_on:
      - api
      - worker

  space:
    container_name: dev-space
    build:
      context: .
      dockerfile: apps/space/Dockerfile.dev
    image: harbor.hwgeneralins.com/plane-dev/space:1.2.1-dev
    #restart: unless-stopped
    env_file:
      - ./apps/space/.env.dev
    networks:
      - dev_env
    volumes:
      - ./apps/space:/app/apps/space
      - ./node_modules:/app/node_modules
      - ./packages:/app/packages
    depends_on:
      - api
      - worker
      - web

  admin:
    container_name: dev-admin
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    image: harbor.hwgeneralins.com/plane-dev/admin:1.2.1-dev
    #restart: unless-stopped
    env_file:
      - ./apps/admin/.env.dev
    networks:
      - dev_env
    volumes:
      - ./apps/admin:/app/apps/admin
      - ./node_modules:/app/node_modules
      - ./packages:/app/packages
    depends_on:
      - api
      - worker
      - web

  live:
    container_name: dev-live
    build:
      context: .
      dockerfile: apps/live/Dockerfile.dev
    image: harbor.hwgeneralins.com/plane-dev/live:1.2.1-dev
    #restart: unless-stopped
    env_file:
      - ./apps/live/.env.dev
    networks:
      - dev_env
    volumes:
      - ./apps/live:/app/apps/live
      - ./node_modules:/app/node_modules
      - ./packages:/app/packages

    depends_on:
      - api
      - worker
      - web

  api:
    container_name: dev-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    image: harbor.hwgeneralins.com/plane-dev/api:1.2.1-dev
    #restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    container_name: dev-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    image: harbor.hwgeneralins.com/plane-dev/api:1.2.1-dev
    #restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
  beat-worker:
    container_name: dev-beat-worker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    image: harbor.hwgeneralins.com/plane-dev/api:1.2.1-dev
    #restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  migrator:
    container_name: dev-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    image: harbor.hwgeneralins.com/plane-dev/api:1.2.1-dev
    #restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  proxy:
    container_name: plane.hgi.com
    build:
      context: ./apps/nginx
      dockerfile: Dockerfile.dev
    image: harbor.hwgeneralins.com/plane-dev/proxy:1.2.1-dev
    #restart: unless-stopped
    ports:
      - ${NGINX_PORT}:18080
    env_file:
      - .env.dev
    networks:
      dev_env:
        aliases:
          - plane.hgi.com
    environment:
      # FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:
  web-root-node-modules:
  web-app-node-modules:
  space-root-node-modules:
  space-app-node-modules:
  admin-root-node-modules:
  admin-app-node-modules:
  live-root-node-modules:
  live-app-node-modules:

networks:
  dev_env:
    external: true
